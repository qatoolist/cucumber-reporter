name: Verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')) }}
jobs:
  go:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - run: sudo apt-get update && sudo apt-get install -y ghostscript ruby-full build-essential
      - run: sudo gem install cucumber -v 9.2.1 --no-document
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --prefix internal/browsercheck
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: make release-gate
      - run: make browser-check
  browser:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: pip install -r internal/browsercheck/requirements.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Generate offline fixture
        run: |
          mkdir -p /tmp/reporter-check
          go run ./cmd/cucumber-report -enhanced -bundle -options testdata/synthetic/showcase/options-enhanced.json -o /tmp/reporter-check testdata/synthetic/showcase
      - run: python internal/browsercheck/check.py /tmp/reporter-check/html-*/index.html ${{ matrix.browser }}
      - name: Generate enhanced retry fixture
        run: |
          mkdir -p /tmp/reporter-retries
          go run ./cmd/cucumber-report -enhanced -o /tmp/reporter-retries testdata/captured/cucumber-ruby-9.2.1-retry/retry.json
      - run: python internal/browsercheck/retries.py /tmp/reporter-retries/html-*/index.html ${{ matrix.browser }}
      - name: Generate empty report
        run: |
          mkdir -p /tmp/reporter-empty
          echo '[]' > /tmp/reporter-empty.json
          go run ./cmd/cucumber-report -enhanced -o /tmp/reporter-empty /tmp/reporter-empty.json
      - name: Generate Messages retry report
        run: |
          mkdir -p /tmp/reporter-messages
          go run ./cmd/cucumber-report -enhanced -format messages -o /tmp/reporter-messages testdata/round15/captured/s3-retry2/run.ndjson
      - run: python internal/browsercheck/interactions.py /tmp/reporter-retries/html-*/index.html /tmp/reporter-empty/html-*/index.html /tmp/reporter-messages/html-*/index.html ${{ matrix.browser }}
      - name: Prove the interaction checks fail on broken behaviour
        if: matrix.browser == 'chromium'
        run: python internal/browsercheck/interactions_mutants.py /tmp/reporter-retries/html-*/index.html /tmp/reporter-empty/html-*/index.html /tmp/reporter-messages/html-*/index.html chromium
